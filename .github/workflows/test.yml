name: pytest

on:
    push:
        branches:
            - master
        paths:
            - 'server/**'
    pull_request:
        paths:
            - 'server/**'
    workflow_dispatch:

permissions:
  contents: read

jobs:
    test:
        name: Run Python tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Install pytest and test dependencies
              run: uv pip install --system pytest requests PyPDF2

            - name: Run tests
              run: pytest tests/
